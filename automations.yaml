- id: '1629895298921'
  alias: Bel inschakelen / uitschakelen
  description: Schakelt de bel in of uit.
  triggers:
  - trigger: time
    at: 07:00:00
    id: inschakeltijd
  - event: start
    id: ha-start
    trigger: homeassistant
  - at: '20:00:00'
    id: uitschakeltijd
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: switch.gang_bel_enabled
          state: 'off'
        - condition: or
          conditions:
          - condition: trigger
            id: inschakeltijd
          - condition: and
            conditions:
            - condition: trigger
              id: ha-start
            - condition: time
              after: 07:00:00
              before: '20:00:00'
      sequence:
      - data: {}
        target:
          entity_id: switch.gang_bel_enabled
        action: switch.turn_on
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: switch.gang_bel_enabled
          state: 'on'
        - condition: or
          conditions:
          - condition: trigger
            id: uitschakeltijd
          - condition: and
            conditions:
            - condition: trigger
              id: ha-start
            - condition: time
              after: '20:00:00'
              before: 07:00:00
      sequence:
      - data: {}
        target:
          entity_id: switch.gang_bel_enabled
        action: switch.turn_off
  initial_state: true
  mode: single
