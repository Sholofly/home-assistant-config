- id: '1776883500000'
  alias: Dagelijks batterij rapport
  description: 'Stuurt om 16:30 een melding met apparaten die een lage batterij hebben
    of unavailable zijn, inclusief het benodigde batterijtype.

    '
  triggers:
  - trigger: time
    at: '16:30:00'
  conditions: []
  actions:
  - variables:
      threshold: 20
      battery_lines: "{% set ns = namespace(unavail=[], low=[]) %} {% set sensors
        = states.sensor\n  | selectattr('attributes.device_class', 'defined')\n  |
        selectattr('attributes.device_class', 'eq', 'battery')\n  | rejectattr('entity_id',
        'search', 'telefoon')\n  | rejectattr('entity_id', 'search', 'tablet')\n  |
        rejectattr('entity_id', 'search', 'phone')\n  | rejectattr('entity_id', 'search',
        'lenovo')\n  | rejectattr('entity_id', 'search', '_battery_plus')\n  | list
        %}\n{% for s in sensors %}\n  {% set name = state_attr(s.entity_id, 'friendly_name')\n
        \   | default(s.entity_id)\n    | replace(' Battery', '')\n    | replace('
        battery', '')\n    | replace(' Batterij', '') %}\n  {% set type_id = s.entity_id
        | regex_replace('_battery(_\\d+)?$', '_battery_type') %}\n  {% set btype =
        states(type_id) %}\n  {% set btype = btype if btype not in ['unknown', 'unavailable',
        'None', none] else '?' %}\n  {% if s.state in ['unavailable', 'unknown'] %}\n
        \   {% set ns.unavail = ns.unavail + [{'name': name, 'type': btype}] %}\n
        \ {% elif s.state | float(0) < threshold %}\n    {% set ns.low = ns.low +
        [{'name': name, 'level': s.state | float(0), 'display': s.state | round(0)
        | int ~ '%', 'type': btype}] %}\n  {% endif %}\n{% endfor %} {% set low_sorted
        = ns.low | sort(attribute='level') %} {% set parts = namespace(val='') %}
        {% if ns.unavail | length > 0 %}\n  {% set lines = ['\U0001FAAB Unavailable
        (' ~ ns.unavail | length ~ '):'] + ns.unavail | map(attribute='name') | map('regex_replace',
        '^(.+)$', '• \\\\1') | list %}\n  {% set parts.val = parts.val ~ lines | join('\\n')
        %}\n{% endif %} {% if low_sorted | length > 0 %}\n  {% set lines = ['\U0001F50B
        Laag (' ~ low_sorted | length ~ '):'] + low_sorted | map(attribute='name')
        | map('regex_replace', '^(.+)$', '• \\\\1') | list %}\n  {% set parts.val
        = parts.val ~ ('\\n\\n' if parts.val | length > 0 else '') ~ lines | join('\\n')
        %}\n{% endif %} {{ parts.val }}"
  - condition: template
    value_template: '{{ battery_lines | trim | length > 0 }}'
  - action: notify.mobile_app_telefoon_rudolf
    data:
      title: "\U0001F50B Batterij rapport"
      message: '{{ battery_lines | trim }}'
      data:
        clickAction: /mobile-dashboard/onderhoud
        url: /mobile-dashboard/onderhoud
        notification_icon: mdi:battery-heart
  mode: single
- id: '1776900000001'
  alias: Log persoons-notificaties
  description: Logt elke notificatie naar een mobiele companion app als persistent
    notification
  initial_state: false
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: notify
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.service is match(''mobile_app_'') }}'
  actions:
  - action: persistent_notification.create
    data:
      title: "\U0001F4F2 Notificatie verzonden"
      message: '**Naar:** {{ trigger.event.data.service | replace(''mobile_app_'',
        '''') | replace(''_'', '' '') | title }} {% if trigger.event.data.service_data.title
        is defined %} **Titel:** {{ trigger.event.data.service_data.title }} {% endif
        %} **Bericht:** {{ trigger.event.data.service_data.message | default(''(geen
        bericht)'') }} **Tijdstip:** {{ now().strftime(''%d-%m-%Y %H:%M:%S'') }}'
      notification_id: notify_log_{{ now().strftime('%Y%m%d%H%M%S') }}
  mode: queued
  max: 20
