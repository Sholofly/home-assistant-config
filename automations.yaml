- id: '1624693857334'
  alias: Nachtverlichting buiten
  description: Handle night lights based on illumination
  triggers:
  - entity_id:
    - binary_sensor.donker_buiten
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.donker_buiten
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.voortuin_deur
          - light.voortuin_hek
    - conditions:
      - condition: state
        entity_id: binary_sensor.donker_buiten
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.voortuin_deur
          - light.voortuin_hek
  initial_state: true
- id: '1624693897568'
  alias: Ramen boven staan nog open
  triggers:
  - entity_id: group.trackable_family
    to: home
    trigger: state
  - at: '16:00:00'
    trigger: time
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: '16:00:00'
      before: '20:00:00'
    - condition: state
      entity_id: group.parents
      state: home
    - condition: state
      entity_id: binary_sensor.ramen_boven
      state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: person.rudolf
        state: home
      sequence:
      - data:
          title: Er staan nog ramen open
          message: '{{ message_data }}'
          data:
            ttl: 0
            priority: high
            notification_icon: mdi:window-open
        action: notify.mobile_app_telefoon_rudolf
    - conditions:
      - condition: state
        entity_id: person.leny
        state: home
      sequence:
      - data:
          title: Er staan nog ramen open
          message: '{{ message_data }}'
          data:
            ttl: 0
            priority: high
            notification_icon: mdi:window-open
        action: notify.mobile_app_telefoon_leny
  variables:
    message_data: "{% for entity_id in states.binary_sensor.ramen_boven.attributes.entity_id
      -%}\n  {% if(states(entity_id) == 'on')-%}\n      {{- '\\n' -}}\n    - {% print(state_attr(entity_id,'friendly_name')
      + ' (' + area_name(entity_id) + ')') -%}\n  {% endif-%}\n{%- endfor %}"
