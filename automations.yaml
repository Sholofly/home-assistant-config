- id: '1776883500000'
  alias: Dagelijks batterij rapport
  description: 'Stuurt om 16:30 een melding met apparaten die een lage batterij hebben
    of unavailable zijn, inclusief het benodigde batterijtype.

    '
  triggers:
  - trigger: time
    at: '16:30:00'
  conditions: []
  actions:
  - variables:
      threshold: 20
      battery_lines: "{% set ns = namespace(unavail=[], low=[]) %} {% set sensors
        = states.sensor\n  | selectattr('attributes.device_class', 'defined')\n  |
        selectattr('attributes.device_class', 'eq', 'battery')\n  | rejectattr('entity_id',
        'search', 'telefoon')\n  | rejectattr('entity_id', 'search', 'tablet')\n  |
        rejectattr('entity_id', 'search', 'phone')\n  | rejectattr('entity_id', 'search',
        'lenovo')\n  | rejectattr('entity_id', 'search', '_battery_plus')\n  | list
        %}\n{% for s in sensors %}\n  {% set name = ([device_name(s.entity_id), entity_name(s.entity_id)]
        | select | join(' '))\n    | default(s.entity_id, true)\n    | replace(' Battery',
        '')\n    | replace(' battery', '')\n    | replace(' Batterij', '') %}\n  {%
        set type_id = s.entity_id | regex_replace('_battery(_\\d+)?$', '_battery_type')
        %}\n  {% set btype = states(type_id) %}\n  {% set btype = btype if btype not
        in ['unknown', 'unavailable', 'None', none] else '?' %}\n  {% if s.state in
        ['unavailable', 'unknown'] %}\n    {% set ns.unavail = ns.unavail + [{'name':
        name, 'type': btype}] %}\n  {% elif s.state | float(0) < threshold %}\n    {%
        set ns.low = ns.low + [{'name': name, 'level': s.state | float(0), 'display':
        s.state | round(0) | int ~ '%', 'type': btype}] %}\n  {% endif %}\n{% endfor
        %} {% set low_sorted = ns.low | sort(attribute='level') %} {% set parts =
        namespace(val='') %} {% if ns.unavail | length > 0 %}\n  {% set lines = ['\U0001FAAB
        Unavailable (' ~ ns.unavail | length ~ '):'] + ns.unavail | map(attribute='name')
        | map('regex_replace', '^(.+)$', '• \\\\1') | list %}\n  {% set parts.val
        = parts.val ~ lines | join('\\n') %}\n{% endif %} {% if low_sorted | length
        > 0 %}\n  {% set lines = ['\U0001F50B Laag (' ~ low_sorted | length ~ '):']
        + low_sorted | map(attribute='name') | map('regex_replace', '^(.+)$', '• \\\\1')
        | list %}\n  {% set parts.val = parts.val ~ ('\\n\\n' if parts.val | length
        > 0 else '') ~ lines | join('\\n') %}\n{% endif %} {{ parts.val }}"
  - condition: template
    value_template: '{{ battery_lines | trim | length > 0 }}'
  - action: notify.mobile_app_telefoon_rudolf
    data:
      title: "\U0001F50B Batterij rapport"
      message: '{{ battery_lines | trim }}'
      data:
        clickAction: /mobile-dashboard/onderhoud
        url: /mobile-dashboard/onderhoud
        notification_icon: mdi:battery-heart
  mode: single
