- id: '1777000000003'
  alias: Ziggo beneden - reclame doorspolen
  description: Spoelt automatisch door naar het einde van een reclameblok zodra ad_break_active
    op true gaat. Werkt alleen in nDVR modus.
  triggers:
  - trigger: template
    value_template: '{{ state_attr(''media_player.ziggo_beneden'', ''ad_break_active'')
      == true }}'
  conditions:
  - condition: template
    value_template: '{{ state_attr(''media_player.ziggo_beneden'', ''play_mode'')
      == ''nDVR'' }}'
  actions:
  - variables:
      current_pos: '{{ state_attr(''media_player.ziggo_beneden'', ''media_position'')
        | float(0) }}'
      ad_breaks: '{{ state_attr(''media_player.ziggo_beneden'', ''ad_breaks'') }}'
      ad_end: "{% set pos = state_attr('media_player.ziggo_beneden', 'media_position')
        | float(0) %} {% set breaks = state_attr('media_player.ziggo_beneden', 'ad_breaks')
        %} {% set end = namespace(val=pos) %} {% for b in breaks %}\n  {% if b.start
        <= pos <= b.end %}\n    {% set end.val = b.end %}\n  {% endif %}\n{% endfor
        %} {{ end.val }}"
  - condition: template
    value_template: '{{ ad_end | float(0) > current_pos }}'
  - action: media_player.media_seek
    target:
      entity_id: media_player.ziggo_beneden
    data:
      seek_position: '{{ ad_end | float }}'
  mode: single
