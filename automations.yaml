- id: '1671801460867'
  alias: Wasmachine - Status
  description: Status afhandeling wasmachine
  mode: queued
  max: 10
  triggers:
  - entity_id:
    - sensor.bijkeuken_wasmachine_power
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: 'off'
    below: 1
    trigger: numeric_state
  - entity_id: sensor.bijkeuken_wasmachine_power
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: waiting
    below: 7
    above: 1
    trigger: numeric_state
  - entity_id: sensor.bijkeuken_wasmachine_power
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: running
    above: 10
    trigger: numeric_state
  - event_type: mobile_app_notification_action
    id: machine_emptied
    event_data:
      action: MACHINE_EMPTIED
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - data:
          option: Uit
        target:
          entity_id: input_select.bijkeuken_wasmachine_status
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: waiting
      - condition: state
        entity_id: input_select.bijkeuken_wasmachine_status
        state: Bezig
      sequence:
      - data:
          option: Klaar
        target:
          entity_id: input_select.bijkeuken_wasmachine_status
        action: input_select.select_option
      - data: {}
        target:
          entity_id: input_boolean.bijkeuken_wasmachine_legen
        action: input_boolean.turn_on
      - data:
          title: De wasmachine is klaar!
          message: Leegmaken!
          data:
            tag: washing
            persistent: true
            actions:
            - action: MACHINE_EMPTIED
              title: Ik heb hem geleegd!
            notification_icon: mdi:washing-machine-alert
        action: notify.mobile_app_telefoon_rudolf
    - conditions:
      - condition: trigger
        id: waiting
      - condition: state
        entity_id: input_select.bijkeuken_wasmachine_status
        state: Uit
      sequence:
      - data:
          option: Wachten
        target:
          entity_id: input_select.bijkeuken_wasmachine_status
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: running
      sequence:
      - data:
          option: Bezig
        target:
          entity_id: input_select.bijkeuken_wasmachine_status
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: machine_emptied
      sequence:
      - data: {}
        target:
          entity_id: input_boolean.bijkeuken_wasmachine_legen
        action: input_boolean.turn_off
      - data:
          data:
            tag: washing
          message: clear_notification
        action: notify.mobile_app_telefoon_rudolf
- id: '1671804817486'
  alias: Airfryer - Status
  description: Status afhandeling airfryer
  mode: queued
  max: 10
  triggers:
  - entity_id:
    - sensor.kleine_schuur_airfryer_huidig_wattage
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: 'off'
    below: 1
    trigger: numeric_state
  - entity_id: sensor.kleine_schuur_airfryer_huidig_wattage
    for:
      hours: 0
      minutes: 0
      seconds: 2
    id: waiting
    below: 7
    above: 1
    trigger: numeric_state
  - entity_id: sensor.kleine_schuur_airfryer_huidig_wattage
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: running
    above: 10
    trigger: numeric_state
  - event_type: mobile_app_notification_action
    id: fryer_emptied
    event_data:
      action: FRYER_EMPTIED
    trigger: event
  - entity_id:
    - input_select.kleine_schuur_airfryer_status
    to: Uit
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: long-off
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - data:
          option: Uit
        target:
          entity_id: input_select.kleine_schuur_airfryer_status
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: waiting
      - condition: state
        entity_id: input_select.kleine_schuur_airfryer_status
        state: Bezig
      sequence:
      - data:
          option: Klaar
        target:
          entity_id: input_select.kleine_schuur_airfryer_status
        action: input_select.select_option
      - data:
          title: De airfryer is klaar!
          message: Eten!
          data:
            tag: frying
            persistent: true
            actions:
            - action: FRYER_EMPTIED
              title: Ik heb hem geleegd!
            notification_icon: mdi:french-fries
        action: notify.mobile_app_telefoon_rudolf
      - variables:
          originele_volume: '{{ state_attr(''media_player.woonkamer_google_home_mass'',
            ''volume_level'') }}'
      - action: media_player.volume_set
        metadata: {}
        data:
          volume_level: 0.7
        target:
          device_id: 65f629f228f84418b3b24aaac2fbf152
      - action: tts.speak
        metadata: {}
        data:
          cache: false
          message: De airfryer is klaar
          language: nl-NL
          media_player_entity_id: media_player.woonkamer_google_home_mass
        target:
          entity_id: tts.home_assistant_cloud
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - media_player.woonkamer_google_home_mass
          to: idle
      - action: media_player.volume_set
        metadata: {}
        data:
          volume_level: '{{ originele_volume | float }}'
        target:
          device_id: 65f629f228f84418b3b24aaac2fbf152
    - conditions:
      - condition: trigger
        id: waiting
      - condition: state
        entity_id: input_select.kleine_schuur_airfryer_status
        state: Uit
      sequence:
      - data:
          option: Wachten
        target:
          entity_id: input_select.kleine_schuur_airfryer_status
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: running
      sequence:
      - data:
          option: Bezig
        target:
          entity_id: input_select.kleine_schuur_airfryer_status
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: fryer_emptied
      sequence:
      - data:
          data:
            tag: frying
          message: clear_notification
        action: notify.mobile_app_telefoon_rudolf
      - action: tts.cloud_say
        metadata: {}
        data:
          cache: false
          entity_id: media_player.speakers_beneden
          language: nl-NL
          message: De airfryer is klaar!
    - conditions:
      - condition: trigger
        id: long-off
      sequence:
      - data: {}
        target:
          entity_id: switch.kleine_schuur_airfryer
        action: switch.turn_off
