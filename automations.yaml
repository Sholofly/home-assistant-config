    entity_id: valve.achtertuin_druppelslang
    state: closed
  - condition: state
    entity_id: valve.achtertuin_druppel_border
    state: closed
  - condition: state
    entity_id: switch.voortuin_sproeier
    state: 'off'
  actions:
  - variables:
      start_liters: '{{ states(''sensor.meterkast_watermeter_totaal'') | float(0)
        }}'
  - delay:
      minutes: 30
  - condition: template
    value_template: '{{ states(''sensor.waterverbruik_dit_kwartier'') | float(0) >
      2 }}'
  - condition: template
    value_template: "{{\n  (states('sensor.meterkast_watermeter_totaal') | float(0)
      - start_liters) > 100\n}}"
  - action: notify.mobile_app_telefoon_rudolf
    data:
      title: Waterlek gedetecteerd!
      message: 'Er stroomt al meer dan 30 minuten water. Totaal verbruikt: {{ (states(''sensor.meterkast_watermeter_totaal'')
        | float(0) - start_liters) | round(0) }}L. Controleer de kraan in het weiland!'
      data:
        ttl: 0
        priority: high
        channel: alarm_stream
        importance: high
        notification_icon: mdi:water-alert
  mode: single
