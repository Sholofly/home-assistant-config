  - platform: zone
    entity_id: person.rudolf
    zone: zone.ah_t_harde
    event: enter
  - platform: zone
    entity_id: person.leny
    zone: zone.ah_t_harde
    event: enter
  - platform: zone
    entity_id: person.rudolf
    zone: zone.boni_oldebroek
    event: enter
  - platform: zone
    entity_id: person.leny
    zone: zone.boni_oldebroek
    event: enter
  - platform: zone
    entity_id: person.rudolf
    zone: zone.plus_oldebroek
    event: enter
  - platform: zone
    entity_id: person.leny
    zone: zone.plus_oldebroek
    event: enter
  - platform: zone
    entity_id: person.rudolf
    zone: zone.wc_de_vrijheid
    event: enter
  - platform: zone
    entity_id: person.leny
    zone: zone.wc_de_vrijheid
    event: enter
  conditions:
  - condition: numeric_state
    entity_id: todo.shopping_list
    above: 0
  actions:
  - action: todo.get_items
    metadata: {}
    target:
      entity_id: todo.shopping_list
    data:
      status: needs_action
    response_variable: groceries
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''person.rudolf'' }}'
      sequence:
      - action: notify.mobile_app_telefoon_rudolf
        data:
          title: Boodschappen op de lijst!
          message: "Als je toch bij {{states('person.rudolf')}} bent:\n{%- for item
            in groceries['todo.shopping_list']['items'] %}\n  {{ item.summary }}\n{%-
            endfor %}"
          data:
            notification_icon: mdi:cart
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''person.leny'' }}'
      sequence:
      - action: notify.mobile_app_telefoon_leny
        data:
          title: Boodschappen op de lijst!
          message: "Als je toch bij {{states('person.leny')}} bent:\n{%- for item
            in groceries['todo.shopping_list']['items'] %}\n  {{ item.summary }}\n{%-
            endfor %}"
          data:
            notification_icon: mdi:cart
