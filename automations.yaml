    state: 'off'
  actions:
  - repeat:
      for_each:
      - persoon: person.rudolf
        naam: Rudolf
        notify: notify.mobile_app_telefoon_rudolf
        actie: AFVAL_AAN_WEG_RUDOLF
      - persoon: person.leny
        naam: Leny
        notify: notify.mobile_app_telefoon_leny
        actie: AFVAL_AAN_WEG_LENY
      - persoon: person.noa
        naam: Noa
        notify: notify.mobile_app_telefoon_noa
        actie: AFVAL_AAN_WEG_NOA
      - persoon: person.mika
        naam: Mika
        notify: notify.mobile_app_telefoon_mika
        actie: AFVAL_AAN_WEG_MIKA
      sequence:
      - action: script.afval_herinnering_sturen
        data:
          persoon: "{{ repeat.item.persoon }}"
          notify: "{{ repeat.item.notify }}"
          actie: "{{ repeat.item.actie }}"
  mode: single
- id: '1795000000003'
  alias: Afval - reset aan de weg
  description: Zet de helper elke dag om 12:00 terug en ruimt achtergebleven afvalmeldingen op.
  triggers:
  - trigger: time
    at: '12:00:00'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.afval_aan_de_weg
  - repeat:
      for_each:
      - notify.mobile_app_telefoon_rudolf
      - notify.mobile_app_telefoon_leny
      - notify.mobile_app_telefoon_noa
      - notify.mobile_app_telefoon_mika
      sequence:
      - action: "{{ repeat.item }}"
        data:
          message: clear_notification
          data:
            tag: afval
  mode: single
