- id: '1779000000001'
  alias: Omrin container geleegd - stuur melding naar Rudolf en Leny
  description: Stuurt een melding naar Rudolf en Leny wanneer een afvalcontainer is
    geleegd, met het aantal ophalingen dit jaar en de datum.
  triggers:
  - entity_id:
    - sensor.afvalbeheer_omrin_omrin_gft_aantal_ophalingen_dit_jaar
    - sensor.afvalbeheer_omrin_omrin_papier_aantal_ophalingen_dit_jaar
    - sensor.afvalbeheer_omrin_omrin_restafval_aantal_ophalingen_dit_jaar
    trigger: state
    alias: Als aantal ophalingen vaan een afvaltype wijzigt
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n   and trigger.to_state is
      not none\n   and trigger.from_state.state not in ('unknown', 'unavailable')\n
      \  and trigger.to_state.state not in ('unknown', 'unavailable')\n   and (trigger.from_state.state
      | int(0)) < (trigger.to_state.state | int(0)) }}"
    alias: Alleen bij stijging van het aantal ophalingen
  actions:
  - choose:
    - conditions:
      - alias: Check of GFT sensor is getriggerd
        condition: template
        value_template: '{{ trigger.to_state.entity_id == ''sensor.afvalbeheer_omrin_omrin_gft_aantal_ophalingen_dit_jaar''
          }}'
      alias: GFT container opgehaald
      sequence:
      - alias: Stuur melding naar Rudolf
        action: notify.mobile_app_telefoon_rudolf
        data:
          message: De GFT container is opgehaald. Dit is de {{ trigger.to_state.state
            }}e keer dit jaar op {{ state_attr('sensor.afvalbeheer_omrin_omrin_gft_aantal_ophalingen_dit_jaar',
            'last_emptied') }}.
          data:
            notification_icon: mdi:compost
          title: GFT container geleegd
      - alias: Stuur melding naar Leny
        action: notify.mobile_app_telefoon_leny
        data:
          message: De GFT container is opgehaald. Dit is de {{ trigger.to_state.state
            }}e keer dit jaar op {{ state_attr('sensor.afvalbeheer_omrin_omrin_gft_aantal_ophalingen_dit_jaar',
            'last_emptied') }}.
          data:
            notification_icon: mdi:compost
          title: GFT container geleegd
    - conditions:
      - alias: Check of papier sensor is getriggerd
        condition: template
        value_template: '{{ trigger.to_state.entity_id == ''sensor.afvalbeheer_omrin_omrin_papier_aantal_ophalingen_dit_jaar''
          }}'
      alias: Papier container opgehaald
      sequence:
      - alias: Stuur melding naar Rudolf
        action: notify.mobile_app_telefoon_rudolf
        data:
          message: De papier container is opgehaald. Dit is de {{ trigger.to_state.state
            }}e keer dit jaar op {{ state_attr('sensor.afvalbeheer_omrin_omrin_papier_aantal_ophalingen_dit_jaar',
            'last_emptied') }}.
          data:
            notification_icon: mdi:newspaper-variant
          title: Papier container geleegd
      - alias: Stuur melding naar Leny
        action: notify.mobile_app_telefoon_leny
        data:
          message: De papier container is opgehaald. Dit is de {{ trigger.to_state.state
            }}e keer dit jaar op {{ state_attr('sensor.afvalbeheer_omrin_omrin_papier_aantal_ophalingen_dit_jaar',
            'last_emptied') }}.
          data:
            notification_icon: mdi:newspaper-variant
          title: Papier container geleegd
    - conditions:
      - alias: Check of restafval sensor is getriggerd
        condition: template
        value_template: '{{ trigger.to_state.entity_id == ''sensor.afvalbeheer_omrin_omrin_restafval_aantal_ophalingen_dit_jaar''
          }}'
      alias: Restafval container opgehaald
      sequence:
      - alias: Stuur melding naar Rudolf
        action: notify.mobile_app_telefoon_rudolf
        data:
          message: De restafval container is opgehaald. Dit is de {{ trigger.to_state.state
            }}e keer dit jaar op {{ state_attr('sensor.afvalbeheer_omrin_omrin_restafval_aantal_ophalingen_dit_jaar',
            'last_emptied') }}.
          data:
            notification_icon: mdi:trash-can
          title: Restafval container geleegd
      - alias: Stuur melding naar Leny
        action: notify.mobile_app_telefoon_leny
        data:
          message: De restafval container is opgehaald. Dit is de {{ trigger.to_state.state
            }}e keer dit jaar op {{ state_attr('sensor.afvalbeheer_omrin_omrin_restafval_aantal_ophalingen_dit_jaar',
            'last_emptied') }}.
          data:
            notification_icon: mdi:trash-can
          title: Restafval container geleegd
  mode: single
- id: '1780000000001'
  alias: Boodschappenlijst - herinnering bij supermarkt
  description: Stuurt een notificatie met de boodschappenlijst wanneer iemand aankomt
    bij een supermarkt.
