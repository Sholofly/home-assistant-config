play_radio:
  alias: Play Radio
  variables:
    browserkey: '{{ browser_key }}'
  sequence:
  - service: media_player.play_media
    data:
      media_content_id: media-source://radio_browser/{{ browserkey }}
      media_content_type: music
      enqueue: replace
    target:
      entity_id: '{{ media_player }}'
  mode: single
  icon: mdi:radio
deurbel:
  alias: Deurbel
  icon: mdi:doorbell
  mode: restart
  sequence:
  - sequence:
    - metadata: {}
      data:
        filename: /media/snapshots/snapshot_driveway.jpg
      action: camera.snapshot
      target:
        device_id: 3cf9bf2f72fa5b42af3a558448f660c6
    - action: ai_task.generate_data
      metadata: {}
      data:
        task_name: Gather doorbell data
        instructions: "- Describe the scene, describe every person on the scene\n-
          Count number of persons\n- Describe vehicle in image, retrieve license plate
          number\n- Ignore the hanging basket in the picture. \n"
        entity_id: ai_task.google_ai_task
        structure:
          summary:
            description: Summary in Dutch of the scene and the people inside it. Keep
              it under 180 characters
            selector:
              text:
          person_count:
            description: Number of persons in the scene
            selector:
              number:
          licenseno:
            description: License plate number of the car, if visible
            selector:
              text:
        attachments:
          media_content_id: media-source://media_source/local/snapshots/snapshot_driveway.jpg
          media_content_type: image/jpeg
          metadata:
            title: snapshot_driveway.jpg
            thumbnail:
            media_class: image
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
            - media_content_type: ''
              media_content_id: media-source://media_source/local/snapshots
      response_variable: doorbell_data
    - action: notify.mobile_app_telefoon_rudolf
      metadata: {}
      data:
        title: "\U0001F514 Deurbel ({{doorbell_data.data.person_count}} \U0001F9D1\U0001F3FB‍\U0001F9B1)"
        message: '{{doorbell_data.data.summary}}'
        data:
          tag: doorbell
    - action: ai_task.generate_image
      metadata: {}
      data:
        task_name: cartoon
        instructions: Transform this image into a super cute cartoon!
        entity_id: ai_task.google_ai_task
        attachments:
          media_content_id: media-source://media_source/local/snapshots/snapshot_driveway.jpg
          media_content_type: image/jpeg
          metadata:
            title: snapshot_driveway.jpg
            thumbnail:
            media_class: image
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
            - media_content_type: ''
              media_content_id: media-source://media_source/local/snapshots
      response_variable: doorbell_cartoon
    - action: notify.mobile_app_telefoon_rudolf
      metadata: {}
      data:
        title: "\U0001F514 Deurbel ({{doorbell_data.data.person_count}} \U0001F9D1\U0001F3FB‍\U0001F9B1)"
        message: '{{doorbell_data.data.summary}}'
        data:
          tag: doorbell
          image: http://homeassistant.local:8123{{doorbell_cartoon.url}}
  description: ''
announce_keuken:
  use_blueprint:
    path: balloob/announce-text-to-speech-on-media-player.yaml
    input:
      text_to_speech_engine: tts.home_assistant_cloud
      media_player:
      - media_player.keuken_nest_hub_mass
  alias: Announce keuken
  description: ''
ask_kitchen_light_on:
  alias: Ask kitchen light on
  use_blueprint:
    path: homeassistant/ask_yes_no_question.yaml
    input:
      question: It's getting dark in the kitchen, do you want to turn on the lights?
      yes_actions:
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          device_id: c9bcd9c5204db8412b82410fa077b8bb
  description: ''
afval_herinnering_sturen:
  alias: Afval herinnering sturen
  description: Stuurt de persistente afvalherinnering met actieknop naar één persoon, als die thuis is.
  fields:
    persoon:
      description: person-entiteit
      example: person.rudolf
    notify:
      description: notify-actie van de telefoon
      example: notify.mobile_app_telefoon_rudolf
    actie:
      description: actie-id van de knop
      example: AFVAL_AAN_WEG_RUDOLF
  variables:
    ochtend: "{{ now().hour < 12 }}"
    lijst: "{{ states('sensor.omrin_vandaag' if now().hour < 12 else 'sensor.omrin_morgen').split(',') | map('trim') | reject('eq', '') | list }}"
    wat: "{{ 'de containers (' ~ (lijst[:-1] | join(', ')) ~ ' en ' ~ lijst[-1] ~ ')' if lijst | count > 1 else 'de ' ~ lijst[0] ~ ' container' }}"
  sequence:
  - condition: template
    value_template: "{{ is_state(persoon, 'home') }}"
  - action: "{{ notify }}"
    data:
      title: "{{ 'Vandaag is het afvaldag' if ochtend else 'Morgen is een afvaldag' }}"
      message: "Zet {{ wat }} {{ 'nu ' if ochtend }}aan de weg."
      data:
        tag: afval
        channel: Afval
        importance: high
        priority: high
        ttl: 0
        sticky: 'true'
        persistent: true
        clickAction: noAction
        notification_icon: mdi:trash-can-outline
        actions:
        - action: "{{ actie }}"
          title: Staat aan de weg
  mode: parallel
  max: 8
energie_melding_sturen:
  alias: Energiemelding sturen
  description: Stuurt het beste moment voor wasmachine, droger en vaatwasser naar één persoon.
    soort 'ochtend' = goedkoopste periode vandaag, 'avond' = beste start zodat alles morgenochtend klaar is.
  fields:
    soort:
      description: ochtend of avond
      example: ochtend
    notify:
      description: notify-actie van de telefoon
      example: notify.mobile_app_telefoon_rudolf
  sequence:
  - if:
    - condition: template
      value_template: "{{ (now() - as_datetime(state_attr('sensor.stroomplanning', 'bijgewerkt') | default('1970-01-01T00:00:00+00:00'))).total_seconds() > 60 }}"
    then:
    - event: energieplanning_verversen
    - wait_template: "{{ (now() - as_datetime(state_attr('sensor.stroomplanning', 'bijgewerkt') | default('1970-01-01T00:00:00+00:00'))).total_seconds() < 30 }}"
      timeout: '00:00:30'
      continue_on_timeout: true
  - variables:
      samen: "{{ state_attr('sensor.stroomplanning', 'samen_vandaag' if soort == 'ochtend' else 'samen_nacht') }}"
  - condition: template
    value_template: "{{ samen is mapping and samen.start_hm is defined }}"
  - action: "{{ notify }}"
    data:
      title: >-
        {{ 'Goedkoopste stroom vandaag' if soort == 'ochtend' else 'Beste starttijd voor morgenochtend' }}
      message: >-
        {%- if soort == 'ochtend' -%}
          Start wasmachine, droger en vaatwasser om {{ samen.start_hm }}. Tot {{ samen.einde_hm }} is de stroom dan {{ samen.voordeel_pct }}% goedkoper dan gemiddeld.
        {%- else -%}
          Stel de uitgestelde start in op {{ samen.start_hm }}{{ ' (morgen)' if samen.dag == 'morgen' }}. Dan is alles uiterlijk {{ samen.einde_hm }} klaar, voor {{ state_attr('sensor.stroomplanning', 'deadline') }}.
          {%- set od = state_attr('sensor.stroomplanning', 'overdag') -%}
          {%- if od is mapping -%}
          {{ '\n' }}
          {%- if od.pct > 0 -%}
          {{ od.dag | capitalize }} om {{ od.start_hm }} is het nog {{ od.pct }}% goedkoper (ca. € {{ '%.2f' | format(od.euro) | replace('.', ',') }} voor alle drie).
          {%- else -%}
          Overdag ({{ od.dag }} om {{ od.start_hm }}) is het {{ od.pct | abs }}% duurder, dus de nachtstart is het goedkoopst.
          {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      data:
        tag: "{{ 'energie-ochtend' if soort == 'ochtend' else 'energie-avond' }}"
        channel: Energie
        notification_icon: mdi:flash
  mode: parallel
  max: 8
energie_vaatwasser_advies:
  alias: Stroom advies
  description: Spreekt in de keuken op laag volume uit wanneer de stroom het goedkoopst is (de periodes voor wasmachine, droger en vaatwasser).
    Bedoeld om met Google Home aan te roepen (routine 'wanneer is de stroom het goedkoopst' of 'Hey Google, activeer stroom advies').
  icon: mdi:dishwasher
  sequence:
  - variables:
      groep: media_player.speakers_beneden
      leden: >-
        {{ ((state_attr('media_player.speakers_beneden', 'group_members') or []) | reject('eq', 'media_player.speakers_beneden') | list)
           or ['media_player.keuken_nest_hub_mass', 'media_player.woonkamer_chromecast_mass'] }}
      oude_volumes: >-
        {{ ((state_attr('media_player.speakers_beneden', 'group_members') or []) | reject('eq', 'media_player.speakers_beneden') | list
            or ['media_player.keuken_nest_hub_mass', 'media_player.woonkamer_chromecast_mass']) | map('state_attr', 'volume_level') | list }}
      tekst: >-
        {%- macro tijd(hm) -%}{%- set u = hm.split(':')[0] | int -%}{%- set m = hm.split(':')[1] | int -%}{{ u }} uur{{ ' ' ~ m if m > 0 }}{%- endmacro -%}
        {%- set p = state_attr('sensor.stroomplanning', 'periodes') or [] -%}
        {%- set nu = now().timestamp() -%}
        {%- if p | count == 0 -%}
        Ik weet nog niet wanneer de stroom het goedkoopst is.
        {%- else -%}
        {%- set x = p[0] -%}
        {%- if x.bezig -%}
        Nu is de stroom het goedkoopst, tot {{ tijd(x.einde_hm) }}. Zet de wasmachine, droger en vaatwasser nu aan.
        {%- else -%}
        De stroom is het goedkoopst {{ x.label | lower }}, van {{ tijd(x.start_hm) }} tot {{ tijd(x.einde_hm) }}. Stel de apparaten in op klaar over {{ (((x.einde - nu) / 3600) | round(0)) | int }} uur.
        {%- endif -%}
        {%- if p | count > 1 -%}
        {%- set y = p[1] %} Daarna is het ook goedkoop {{ y.label | lower }}, van {{ tijd(y.start_hm) }} tot {{ tijd(y.einde_hm) }}.
        {%- endif -%}
        {%- endif -%}
  - repeat:
      for_each: "{{ leden }}"
      sequence:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ repeat.item }}"
        data:
          volume_level: "{{ states('input_number.energie_spreek_volume') | float(0.2) }}"
  - action: tts.speak
    continue_on_error: true
    target:
      entity_id: tts.home_assistant_cloud
    data:
      cache: false
      language: nl-NL
      media_player_entity_id: "{{ groep }}"
      message: "{{ tekst }}"
  - wait_template: "{{ is_state(groep, 'playing') }}"
    timeout: '00:00:10'
    continue_on_timeout: true
  - wait_template: "{{ not is_state(groep, 'playing') }}"
    timeout: '00:01:00'
    continue_on_timeout: true
  - delay: '00:00:02'
  - repeat:
      for_each: "{{ leden }}"
      sequence:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ repeat.item }}"
        data:
          volume_level: "{{ oude_volumes[repeat.index - 1] | float(0.4) }}"
  mode: single
