################################################
## Entities / Sensors / HA Release Notes RC
## Haalt de nieuwste HA release candidate op via de GitHub API, elke 6 uur
################################################
platform: rest
resource: https://api.github.com/repos/home-assistant/core/releases?per_page=1
value_template: >
  {{ value_json[0].name }}
json_attributes:
  - body
scan_interval: 21600
