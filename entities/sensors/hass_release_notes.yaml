################################################
## Entities / Sensors / HA Release Notes
## Haalt de laatste stabiele HA release op via de GitHub API, elke 6 uur
################################################
platform: rest
resource: https://api.github.com/repos/home-assistant/core/releases/latest
value_template: >
  {{ value_json.name }}
json_attributes:
  - body
scan_interval: 21600
