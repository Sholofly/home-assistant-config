################################################
## Entities / Template Sensors / WiFi AP Naam Mika
## Geeft de naam van de Deco AP (attribuut deco_device van de telefoon-tracker) waar Mika op zit
################################################
name: "Telefoon Mika WiFi AP"
unique_id: "wifi_ap_naam_mika"
icon: "mdi:router-wireless"
state: >
  {% set apparaten = states.device_tracker
     | selectattr('attributes.host_name', 'defined')
     | selectattr('attributes.host_name', 'eq', 'A56-van-Mika')
     | selectattr('state', 'eq', 'home') | list %}
  {% set namen = {'Hallway': 'Gang', 'Bedroom': 'Slaapkamer'} %}
  {% if apparaten %}{% set ap = apparaten[0].attributes.deco_device | default('') %}{{ namen.get(ap, ap) }}{% endif %}
