################################################
## Integrations / REST Command
## HTTP-commando's, o.a. DuckDNS IP-update
################################################
rest_command:
  duckdns_sholofly:
    url: 'https://www.duckdns.org/update?domains=sholofly&token={{states("sensor.duckdns_token")}}&ip={{states("sensor.myip")}}'
    method: GET
