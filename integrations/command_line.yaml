################################################
## Integrations / Command Line
## Shell-sensor voor add-on statistieken (CPU, geheugen, aantal)
## en opslaguitsplitsing per categorie
################################################
command_line:
  - sensor:
      name: "Add-on Stats"
      unique_id: addon_stats_sensor
      command: "python3 /config/scripts/addon_stats.py"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - addons
        - total_cpu
        - total_mem
        - count
      scan_interval: 300
      command_timeout: 60
  - sensor:
      name: "Storage Usage"
      unique_id: storage_usage
      command: "python3 /config/scripts/storage_usage.py"
      value_template: "{{ value_json.state }}"
      json_attributes:
        - ha_config_gb
        - database_gb
        - frigate_gb
        - other_addons_gb
        - media_gb
        - other_gb
        - free_gb
      scan_interval: 3600
      command_timeout: 30
