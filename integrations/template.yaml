################################################
## Integrations / Template
## Berekende sensors, binaire sensoren en trigger-gebaseerde sensors
################################################
template:
  - sensor: !include_dir_list ../entities/templates/sensors
  - binary_sensor: !include_dir_list ../entities/templates/binary_sensors
  - select: !include_dir_list ../entities/templates/selects
  - cover: !include_dir_list ../entities/templates/covers
  - trigger:
      - trigger: event
        event_type: bubble_card_update_modules
    sensor:
      - name: "Bubble Card Modules"
        state: "saved"
        icon: "mdi:puzzle"
        attributes:
          modules: "{{ trigger.event.data.modules }}"
          last_updated: "{{ trigger.event.data.last_updated }}"
  - trigger:
      trigger: event
      event_type: set_camera_description
    sensor:
      - unique_id: 4a4c8e53-9e68-4198-9cc5-b336e228ea4d
        name: Camera detection
        state: "{{trigger.event.data.key}}"
        attributes:
          full_description: "{{ trigger.event.data.value}}"
  - trigger:
      - trigger: time_pattern
        hours: "/1"
      - trigger: homeassistant
        event: start
    action:
      - action: nordpool.get_prices_for_date
        data:
          config_entry: "01KQ0A415V5KZ7DZ05V7FAQ1H6"
          date: "{{ now().date() | string }}"
        response_variable: today_prices
      - action: nordpool.get_prices_for_date
        data:
          config_entry: "01KQ0A415V5KZ7DZ05V7FAQ1H6"
          date: "{{ (now().date() + timedelta(days=1)) | string }}"
        response_variable: tomorrow_prices
    sensor:
      - name: "Nord Pool NL prijzen grafiek"
        unique_id: "nordpool_nl_prijzen_grafiek"
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        state: "{{ states('sensor.nord_pool_nl_huidige_prijs') }}"
        attributes:
          prijzen: >
            {% set window_start = now() - timedelta(hours=1) %}
            {% set window_end = now() + timedelta(hours=24) %}
            {% set data = namespace(prices=[]) %}
            {% for item in today_prices['NL'] %}
              {% set start = item.start | as_datetime | as_local %}
              {% if start >= window_start and start < window_end %}
                {% set data.prices = data.prices + [{'start': item.start, 'end': item.end, 'price': (item.price / 1000) | round(5)}] %}
              {% endif %}
            {% endfor %}
            {% for item in tomorrow_prices['NL'] %}
              {% set start = item.start | as_datetime | as_local %}
              {% if start >= window_start and start < window_end %}
                {% set data.prices = data.prices + [{'start': item.start, 'end': item.end, 'price': (item.price / 1000) | round(5)}] %}
              {% endif %}
            {% endfor %}
            {{ data.prices }}
